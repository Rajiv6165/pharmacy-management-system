<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You are Offline — AetherRx</title>
  <style>
    :root {
      --color-bg: #020617;
      --color-card: #0f172a;
      --color-border: #1e293b;
      --color-text-main: #f8fafc;
      --color-text-sub: #94a3b8;
      --color-primary: #14b8a6;
      --color-primary-hover: #0d9488;
    }
    body {
      background-color: var(--color-bg);
      color: var(--color-text-main);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      max-width: 440px;
      padding: 40px;
      background-color: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
    }
    .container:hover {
      transform: translateY(-2px);
    }
    .icon-container {
      width: 72px;
      height: 72px;
      background-color: rgba(20, 184, 166, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
    }
    .icon {
      font-size: 32px;
      color: var(--color-primary);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--color-text-main);
      margin: 0 0 12px 0;
      letter-spacing: -0.025em;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--color-text-sub);
      margin: 0 0 28px 0;
    }
    .btn {
      background-color: var(--color-primary);
      color: #020617;
      font-weight: 600;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      width: 100%;
      box-sizing: border-box;
      transition: background-color 0.2s ease, transform 0.1s ease;
      letter-spacing: -0.01em;
    }
    .btn:hover {
      background-color: var(--color-primary-hover);
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-container">
      <span class="icon">📶</span>
    </div>
    <h1>Connection Lost</h1>
    <p>Please check your internet connection. AetherRx requires an active network connection to place orders, upload prescriptions, and sync stock availability.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
